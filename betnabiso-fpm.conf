[global]
daemonize = yes
pid = /tmp/betnabiso-fpm.pid
error_log = /tmp/betnabiso-fpm.log

[betnabiso]
user = mac
group = staff
listen = 127.0.0.1:9001
listen.owner = mac
listen.group = staff

pm = dynamic
pm.max_children = 10
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500
