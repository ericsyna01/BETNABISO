ServerRoot "/usr/local/opt/httpd"
PidFile "/tmp/betnabiso-apache.pid"
ErrorLog "/tmp/betnabiso-apache-error.log"
CustomLog "/tmp/betnabiso-apache-access.log" "%h %t \"%r\" %>s %b"

LoadModule mpm_prefork_module lib/httpd/modules/mod_mpm_prefork.so
LoadModule unixd_module lib/httpd/modules/mod_unixd.so
LoadModule authz_core_module lib/httpd/modules/mod_authz_core.so
LoadModule log_config_module lib/httpd/modules/mod_log_config.so
LoadModule mime_module lib/httpd/modules/mod_mime.so
LoadModule dir_module lib/httpd/modules/mod_dir.so
LoadModule alias_module lib/httpd/modules/mod_alias.so
LoadModule rewrite_module lib/httpd/modules/mod_rewrite.so
LoadModule setenvif_module lib/httpd/modules/mod_setenvif.so
LoadModule headers_module lib/httpd/modules/mod_headers.so

# mod_php — PHP intégré directement dans Apache (stable, pas de FPM)
LoadModule php_module /usr/local/Cellar/php/8.5.7/lib/httpd/modules/libphp.so

<IfModule mpm_prefork_module>
    StartServers        5
    MinSpareServers     5
    MaxSpareServers    10
    MaxRequestWorkers  20
    MaxConnectionsPerChild 500
</IfModule>

User mac
Group staff

Listen 8888

TypesConfig /usr/local/etc/httpd/mime.types
DirectoryIndex index.php

DocumentRoot "/Users/mac/Desktop/bet na biso/BetNaBiso_Plateform/betnabiso-api"

<Directory "/Users/mac/Desktop/bet na biso/BetNaBiso_Plateform/betnabiso-api">
    AllowOverride None
    Require all granted
    Options -Indexes

    RewriteEngine On
    RewriteCond %{REQUEST_FILENAME} !-f
    RewriteRule ^ /index.php [QSA,L]
</Directory>

<FilesMatch "\.php$">
    SetHandler application/x-httpd-php
</FilesMatch>
